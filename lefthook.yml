pre-commit:
  commands:
    check:
      glob: '*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}'
      run: bunx eslint {staged_files} --fix --no-warn-ignored
      stage_fixed: true

pre-push:
  jobs:
    - run: bun run typecheck
    - run: bun run lint
    - run: bun run test
    - run: bun run build
