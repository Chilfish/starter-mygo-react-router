name: Release

# 发版流程（docs/planning/reference-mygo-cloudmusic-2026-10-26.md §4）：
#   1. 只 bump mygo.config.ts 的 version，单独提交；
#   2. 打 tag `v<version>` 推上来；
#   3. 本流水线校验版本、建 draft release、按平台构建并上传；
#   4. 手动 `gh release edit v<version> --draft=false --latest` 才算发布。
# 私钥只经 MYGO_UPDATER_PRIVATE_KEY 进入构建；没有它时 mygo build 只出安装包，
# 更新清单会缺，所以这里要求 secret 存在。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Version and gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches mygo.config.ts
        id: version
        run: |
          # 值可能写成单引号（eslint 的 antfu 规则）或双引号：取冒号右侧，
          # 再剥掉引号、逗号与空白。
          version=$(sed -n -E 's/^[[:space:]]*version:[[:space:]]*//p' mygo.config.ts \
            | head -n1 | tr -d " '\",")
          if [ -z "$version" ]; then
            echo "::error::could not read version from mygo.config.ts"
            exit 1
          fi
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: The changelog has this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qx "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version' section; mygo build takes the update notes from it"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Go gates
        run: |
          go build ./...
          go vet ./...
          go vet -tags devcookie ./...
          go test ./...
          go test -tags devcookie ./...

      - name: Web gates
        run: |
          bun run typecheck
          bun test

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '
            $0 == "## " v { inside = 1; next }
            /^## / { inside = 0 }
            inside' CHANGELOG.md)
          if [ -z "$notes" ]; then
            echo "::error::the changelog section for $GITHUB_REF_NAME is empty"
            exit 1
          fi
          printf '%s\n' "$notes" > /tmp/notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-linux
            os: ubuntu-latest
            platform: windows/amd64,linux/amd64
          - name: macos
            os: macos-latest
            platform: darwin/universal
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
      MYGO_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.MYGO_WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      # Windows 的安装包用 NSIS 打，可以在 Linux 上交叉编出来。
      - name: NSIS (for the Windows installer)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nsis zip

      # macOS 的签名与公证要证书和 notarytool 凭据；没配时 mygo build 出的是
      # 未签名包（本机能跑，分发给别人会被 Gatekeeper 拦）。配好 secrets 后
      # 再把 macos.signingIdentity / macos.notarize 写进 mygo.config.ts。
      - name: Build and upload
        run: bunx mygo build -platform "${{ matrix.platform }}" -upload

      # 便携版单独一个 zip，里面的目录保持完整：解压后 exe、DLL、图标在同一层。
      # 只给 exe 的散装下载会让打包版启动时报「mygo-sqlite3.dll is missing」，
      # 这正是这次踩到的坑。setup.exe 只负责安装，不再当便携包用。
      - name: Portable Windows zip
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          name="weibo-archiver-$VERSION-windows-amd64-portable.zip"
          stage=$(mktemp -d)
          mkdir -p "$stage/Weibo Archiver"
          cp "release/windows-amd64/Weibo Archiver.exe" \
             "release/windows-amd64/mygo-sqlite3.dll" \
             "release/windows-amd64/icon.png" \
             "$stage/Weibo Archiver/"
          (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/release/$name" "Weibo Archiver")
          gh release upload "v$VERSION" "release/$name" --clobber

      - name: Keep the installers on the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: release/
          if-no-files-found: warn

  verify:
    name: Update feeds
    needs: [guard, build]
    runs-on: ubuntu-latest
    # draft 的资产匿名下载是 404，所以这里用带 token 的 gh 拉，而不是 curl。
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: The draft has a feed per platform
        run: |
          version="${{ needs.guard.outputs.version }}"
          repo="${{ github.repository }}"
          dir=$(mktemp -d)
          failed=0

          check() {
            name="$1"
            if ! gh release download "v$version" --repo "$repo" --pattern "$name" --dir "$dir" --clobber; then
              return 1
            fi
            got=$(sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p' "$dir/$name" | head -n1)
            if [ "$got" != "$version" ]; then
              echo "::error::$name says version '$got', expected '$version'"
              return 1
            fi
            echo "ok $name ($got)"
          }

          # Windows 是必发产物。
          check update-windows-amd64.json || failed=1
          # darwin/universal 的清单名可能是 universal，也可能拆成两个 arch。
          if ! check update-darwin-universal.json; then
            check update-darwin-arm64.json || failed=1
          fi
          # Linux 是可选产物，缺了只警告。
          check update-linux-amd64.json || echo "::warning::no linux feed"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      # 便携 zip 必须解压出完整应用（exe + DLL + 图标），并且要进校验和：
      # 它是在 mygo 写完 SHA256SUMS 之后才上传的，不会自己出现。
      - name: The portable zip is complete and checksummed
        run: |
          version="${{ needs.guard.outputs.version }}"
          repo="${{ github.repository }}"
          name="weibo-archiver-$version-windows-amd64-portable.zip"
          dir=$(mktemp -d)
          gh release download "v$version" --repo "$repo" --pattern "$name" --dir "$dir" --clobber
          gh release download "v$version" --repo "$repo" --pattern SHA256SUMS --dir "$dir" --clobber

          for file in "Weibo Archiver/Weibo Archiver.exe" "Weibo Archiver/mygo-sqlite3.dll" "Weibo Archiver/icon.png"; do
            if ! unzip -l "$dir/$name" | grep -qF "$file"; then
              echo "::error::$name is missing $file"
              exit 1
            fi
          done

          (cd "$dir" && sha256sum "$name") > "$dir/portable.sum"
          grep -vF "  $name" "$dir/SHA256SUMS" > "$dir/SHA256SUMS.new" || true
          cat "$dir/portable.sum" >> "$dir/SHA256SUMS.new"
          mv "$dir/SHA256SUMS.new" "$dir/SHA256SUMS"
          gh release upload "v$version" "$dir/SHA256SUMS" --clobber

      - name: Next step
        run: |
          echo "Publish with: gh release edit v${{ needs.guard.outputs.version }} --draft=false --latest"
